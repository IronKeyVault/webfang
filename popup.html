<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    p { font-size: 12px; color: #555; margin: 0 0 12px; line-height: 1.4; }
    button {
      width: 100%; padding: 10px; font-size: 14px; font-weight: 600;
      color: #fff; background: #2563eb; border: none; border-radius: 8px; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button + button { margin-top: 8px; background: #7c3aed; }
    button + button:hover { background: #6d28d9; }
    .hint { font-size: 11px; color: #888; margin-top: 10px; line-height: 1.4; }
    .err {
      display: none; margin-top: 10px; padding: 8px; border-radius: 6px;
      background: #fef2f2; color: #991b1b; font-size: 11px; line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>📋 Webfang</h1>
  <p>Tryk Optag, klik på det du vil have – artiklen kopieres til udklipsholderen, videoen hentes som fil.</p>
  <button id="start">Optag artikel</button>
  <button id="startVideo">🎬 Optag video</button>
  <div id="err" class="err"></div>
  <div class="hint">
    Artikel: indsæt bagefter med Ctrl+V i Word, OneNote eller mail.<br>
    Video: gemmes i Overførsler.
  </div>
  <script src="popup.js"></script>
</body>
</html>
