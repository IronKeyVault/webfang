<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    p { font-size: 12px; color: #555; margin: 0 0 12px; line-height: 1.4; }
    button {
      width: 100%; padding: 10px; font-size: 14px; font-weight: 600;
      color: #fff; background: #2563eb; border: none; border-radius: 8px; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button + button { margin-top: 8px; background: #7c3aed; }
    button + button:hover { background: #6d28d9; }
    .hint { font-size: 11px; color: #888; margin-top: 10px; line-height: 1.4; }
    .err {
      display: none; margin-top: 10px; padding: 8px; border-radius: 6px;
      background: #fef2f2; color: #991b1b; font-size: 11px; line-height: 1.4;
    }
    .seq {
      margin-top: 12px; padding-top: 10px; border-top: 1px solid #eee;
      font-size: 12px; color: #444;
    }
    .seq label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .seq .row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .seq input[type=number] {
      width: 70px; padding: 5px 6px; font-size: 13px;
      border: 1px solid #ccc; border-radius: 6px;
    }
    .seq .saved { font-size: 11px; color: #16a34a; visibility: hidden; }
    .seq .note { font-size: 11px; color: #888; margin-top: 4px; line-height: 1.35; }
  </style>
</head>
<body>
  <h1>📋 Webfang</h1>
  <p>Tryk Optag, klik på det du vil have – artiklen kopieres til udklipsholderen, videoen hentes som fil.</p>
  <button id="start">Optag artikel</button>
  <button id="startVideo">🎬 Optag video</button>
  <div id="err" class="err"></div>
  <div class="seq">
    <label><input type="checkbox" id="seqOn"> Nummerér videoer</label>
    <div class="row">
      <span>Næste nr:</span>
      <input type="number" id="seqNext" min="1" step="1">
      <span id="seqSaved" class="saved">gemt ✓</span>
    </div>
    <label style="margin-top:10px">
      <input type="checkbox" id="ask"> Spørg hvor filen skal gemmes
    </label>
    <div class="note">
      Ellers bruges browserens downloadmappe
      (<code>chrome://settings/downloads</code>).
    </div>
  </div>
  <div class="hint">
    Artikel: indsæt bagefter med Ctrl+V i Word, OneNote eller mail.<br>
    Video: gemmes i Overførsler.
  </div>
  <script src="popup.js"></script>
</body>
</html>
